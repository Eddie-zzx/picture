server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: yu-picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picture
    username: root
    password: 123456
  # 开放文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.graduation.picture.controller

# 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: https://picture-1317608563.cos.ap-guangzhou.myqcloud.com
    secretId:
    secretKey:
    region: ap-guangzhou
    bucket: picture-1317608563